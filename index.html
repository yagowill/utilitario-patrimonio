<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Utilitário de patrimônio da Polícia Civil do Estado do Pará: formatador de RPs e geração de publicação de bens baixados."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Utilitário de Patrimônio</title>
    <script>
      // Aplica o tema salvo antes da montagem do Vue para evitar flash de tela clara.
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('utilitario-patrimonio-theme')
          const shouldUseDark =
            savedTheme === 'dark' ||
            (savedTheme === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', shouldUseDark)
          document.documentElement.style.colorScheme = shouldUseDark ? 'dark' : 'light'
        } catch {
          // O tema claro é o padrão quando o armazenamento local está indisponível.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
